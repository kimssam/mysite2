<!doctype html>
<html lang="en">

<head>
	<meta charset="UTF-8" />
	<title>Document</title>
	<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css"
		integrity="sha384-xOolHFLEh07PJGoPkLv1IbcEPTNtaed2xpHsD9ESMhqIYd0nLMwNLD69Npy4HI+N" crossorigin="anonymous">
</head>

<body>
	<nav class="mb-5 navbar navbar-expand-sm navbar-dark bg-info">
		<div class="container">
			<a class="navbar-brand" th:href="@{/}">Springboot Study</a>
			<button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbarSupportedContent"
				aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">
				<span class="navbar-toggler-icon"></span>
			</button>

			<div class="collapse navbar-collapse" id="navbarSupportedContent">
				<ul class="navbar-nav mr-auto">
					<li class="nav-item active">
						<a class="nav-link py-4" th:href="@{/question/list}">게시판</a>
					</li>
					<li class="nav-item">
						<a class="nav-link py-4" th:href="@{/boxoffice}">박스 오피스 보러가기</a>
					</li>
					<li class="nav-item">
						<a class="nav-link py-4" th:href="@{/user/login}" sec:authorize="isAnonymous()">로그인</a>
						<a class="nav-link" th:href="@{/user/logout}" sec:authorize="isAuthenticated()">
							<img th:src="@{${profileImage} != null ? ${profileImage} : '/img/user/default-profile.png'}" alt="프로필이미지" width="60" height="60" class="rounded-circle"/>
							로그아웃
						</a>

					</li>
					<li class="nav-item" sec:authorize="isAnonymous()">
						<a class="nav-link py-4" th:href="@{/user/signup}">회원가입</a>
					</li>
				</ul>
			</div>
		</div>
	</nav>
	<th:block layout:fragment="content"></th:block>

		integrity="sha384-DfXdz2htPH0lsSSs5nCTpuj/zy4C+OGpamoFVy38MVBnE+IbbVYUew+OrCXaRkfj"
		crossorigin="anonymous"></script>-->
	<script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
	<script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.bundle.min.js"
		integrity="sha384-Fy6S3B9q64WdZWQUiU+q4/2Lc9npb8tCaSX9FK7E8HnRr0Jz8D6OP9dO5Vg3Q9ct"
		crossorigin="anonymous"></script>
	<th:block layout:fragment="script"></th:block>
</body>

</html>
