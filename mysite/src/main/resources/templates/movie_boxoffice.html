<html layout:decorate="~{layout}">
	<div layout:fragment="content" class="container">
		<div class="jumbotron text-center">
			<h1>일별 영화 박스 오피스</h1>
		</div>

		<table class="table table-hover">
			<thead>
				<tr>
					<th scope="col">박스오피스 순위</th>
					<th scope="col">영화명</th>
					<th scope="col">영화 포스터</th>
					<th scope="col">개봉일</th>
					<th scope="col">누적관객수</th>
					<th scope="col">누적매출액</th>
				</tr>
			</thead>
			<tbody class="table-body">
				<!-- ajax로 가져온 데이터 출력 -->
			</tbody>
		</table>
	</div>

	<script layout:fragment="script">
		$(function () {
			console.log("ajax 시작");

			const today = getDate();
			console.log("요청 날짜:", today);

			getJSON(today);

			function getJSON(targetDt) {
				$.ajax({
					type: "get",
					url: "/api/boxoffice",
					data: { targetDt: targetDt },
					dataType: "json",   // ⭐ 가장 중요한 수정 포인트
					success: function (data) {
						console.log("통신 성공");
						console.log("전체 data:", data);

						const list = data.boxOfficeResult.dailyBoxOfficeList;
						let str = "";

						$.each(list, function (i, item) {
							str += `
								<tr>
									<td>${item.rank}</td>
									<td>${item.movieNm}</td>
									<td>
										<img src="/img/movies/${item.movieCd}.jpg" alt="" width="100"/>
									</td>
									<td>${item.openDt}</td>
									<td>${Number(item.audiAcc).toLocaleString()}명</td>
									<td>${Number(item.salesAcc).toLocaleString()}원</td>
								</tr>
							`;
						});

						$(".table-body").append(str);
					},
					error: function () {
						console.log("통신 에러");
					}
				});
			}

			function getDate() {
				const date = new Date();
				let yyyy = date.getFullYear();
				let mm = date.getMonth() + 1;
				let dd = date.getDate() - 1;

				if (mm < 10) mm = "0" + mm;
				if (dd < 10) dd = "0" + dd;

				return yyyy + "" + mm + "" + dd;
			}
		});
	</script>
</html>
